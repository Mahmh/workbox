services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: workbox_server_c
    env_file:
      - ./.env
    ports:
      - "8001:8000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: workbox_client_c
    env_file:
      - ./.env
    ports:
      - "3001:3000"
    depends_on:
      - server