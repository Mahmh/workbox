name: workbox

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: workbox-server-c
    env_file:
      - ./server/.env
    ports:
      - "8003:8000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: workbox-client-c
    env_file:
      - ./client/.env
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      - server