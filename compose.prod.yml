services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: workbox_server_c
    env_file:
      - ./server/.env
    ports:
      - "8001:8000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: workbox_client_c
    env_file:
      - ./client/.env
    ports:
      - "3001:3000"
    depends_on:
      - server
  
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    container_name: workbox_nginx_c
    ports:
      - "81:80"
      - "444:443"
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - client
      - server