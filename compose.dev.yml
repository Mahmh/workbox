services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: server_dev
    env_file:
      - ./server/.env
    ports:
      - "8001:8000"
    volumes:
      - ./server:/app

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: client_dev
    env_file:
      - ./client/.env
    ports:
      - "3001:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
  
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.dev
    container_name: nginx_dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server